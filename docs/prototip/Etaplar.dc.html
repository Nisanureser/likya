<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Etaplar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#3B6D11}a:hover{color:#27500A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F1E8; color: #173404; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 16px 12px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 600">Etaplar</h1>
    <a href="Acil.dc.html" aria-label="Acil durum" style="width: 44px; height: 44px; border-radius: 50%; background: #A32D2D; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #FFFFFF; font-size: 12px; font-weight: 700">SOS</a>
  </div>
  <div style="display: flex; gap: 8px; padding: 0 16px 12px">
    <span style="padding: 6px 12px; border-radius: 999px; background: #3B6D11; color: #EAF3DE; font-size: 13px; font-weight: 500">Tümü · 29</span>
    <span style="padding: 6px 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #D3D1C7; color: #5F5E5A; font-size: 13px">Batı</span>
    <span style="padding: 6px 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #D3D1C7; color: #5F5E5A; font-size: 13px">Doğu</span>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 0 16px; overflow: hidden">
    <sc-for list="{{ stages }}" as="s" hint-placeholder-count="5">
    <a href="EtapDetay.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid {{ s.border }}; text-decoration: none; color: #173404">
      <div style="width: 40px; height: 40px; border-radius: 12px; background: {{ s.numBg }}; color: {{ s.numFg }}; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; flex-shrink: 0">{{ s.n }}</div>
      <div style="display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0">
        <span style="font-size: 16px; font-weight: 600">{{ s.name }}</span>
        <span style="font-size: 13px; color: #5F5E5A">{{ s.meta }}</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0">
        <span style="font-size: 13px; font-weight: 500; color: #185FA5">{{ s.water }}</span>
        <span style="font-size: 12px; color: #888780">{{ s.lodging }}</span>
      </div>
    </a>
    </sc-for>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-top: 1px solid #D3D1C7; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px">
    <a href="Harita.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 70px; text-decoration: none; color: #888780; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#888780" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 6v16l7-4 8 4 7-4V2l-7 4-8-4-7 4z"/><path d="M8 2v16M16 6v16"/></svg>Harita
    </a>
    <a href="Etaplar.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 70px; text-decoration: none; color: #27500A; font-size: 11px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#27500A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20l6-14 4 8 3-5 5 11z"/></svg>Etap
    </a>
    <a href="Pano.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 70px; text-decoration: none; color: #888780; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#888780" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Pano
    </a>
    <a href="Profil.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 70px; text-decoration: none; color: #888780; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#888780" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Ben
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      { n: 10, name: 'Faralya → Kabak', meta: '7,8 km · ▲ 420 m · 3,5 sa', water: '2 su', lodging: '3 pansiyon' },
      { n: 11, name: 'Kabak → Alınca', meta: '6,2 km · ▲ 540 m · 3 sa', water: '1 su', lodging: '2 pansiyon' },
      { n: 12, name: 'Alınca → Gey', meta: '11,4 km · ▲ 310 m · 4,5 sa', water: '3 su', lodging: '1 pansiyon', active: true },
      { n: 13, name: 'Gey → Bel', meta: '9,1 km · ▲ 380 m · 4 sa', water: '1 su', lodging: 'kamp' },
      { n: 14, name: 'Bel → Sidyma', meta: '12,7 km · ▲ 260 m · 5 sa', water: '2 su', lodging: '2 pansiyon' },
      { n: 15, name: 'Sidyma → Bozburun', meta: '10,3 km · ▲ 450 m · 4,5 sa', water: '0 su', lodging: 'kamp' }
    ];
    return {
      stages: raw.map(s => ({
        ...s,
        border: s.active ? '#3B6D11' : '#D3D1C7',
        numBg: s.active ? '#3B6D11' : '#EAF3DE',
        numFg: s.active ? '#EAF3DE' : '#27500A'
      }))
    };
  }
}
</script>
</body>
</html>
