<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Avatarını yap</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#3B6D11}a:hover{color:#27500A}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bob{animation:bob 2.6s ease-in-out infinite}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F1E8; color: #173404; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 16px 8px">
    <div style="display: flex; flex-direction: column">
      <h1 style="margin: 0; font-size: 26px; font-weight: 600">Ben</h1>
      <span style="font-size: 13px; color: #5F5E5A">Avatarın, haritada seni temsil eder</span>
    </div>
    <a href="Acil.dc.html" aria-label="Acil durum" style="width: 44px; height: 44px; border-radius: 50%; background: #A32D2D; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #FFFFFF; font-size: 12px; font-weight: 700">SOS</a>
  </div>
  <div style="margin: 8px 16px 0; height: 200px; border-radius: 22px; background: #EAF3DE; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden">
    <svg width="390" height="200" viewBox="0 0 390 200" aria-hidden="true" style="position: absolute; inset: 0"><path d="M0 160 L80 110 L150 150 L240 80 L320 140 L390 100 L390 200 L0 200Z" fill="#C0DD97"/><path d="M-10 190 C100 160 150 110 240 100 S380 60 400 50" fill="none" stroke="#3B6D11" stroke-width="6" stroke-linecap="round"/></svg>
    <div class="bob" style="position: relative">
      <svg width="120" height="120" viewBox="-60 -60 120 120" aria-hidden="true">
        <circle r="58" fill="#FFFFFF"/><circle r="53" fill="{{ bg }}"/>
        <circle cy="-12" r="20" fill="{{ skin }}"/>
        <path d="M-30 40c1-20 15-28 30-28s29 8 30 28" fill="{{ shirt }}"/>
        <sc-if value="{{ hasPack }}" hint-placeholder-val="{{ true }}"><rect x="18" y="4" width="18" height="30" rx="7" fill="#854F0B"/></sc-if>
        <circle cx="-7" cy="-14" r="2.5" fill="#4A1B0C"/><circle cx="7" cy="-14" r="2.5" fill="#4A1B0C"/>
        <path d="M-7 -5q7 6 14 0" stroke="#4A1B0C" stroke-width="2" fill="none" stroke-linecap="round"/>
        <sc-if value="{{ hairLong }}" hint-placeholder-val="{{ true }}"><path d="M-22 -14q22-30 44 0 v14 q-22 -8 -44 0z" fill="{{ hair }}"/></sc-if>
        <sc-if value="{{ hairShort }}" hint-placeholder-val="{{ false }}"><path d="M-20 -18c3-18 37-18 40 0z" fill="{{ hair }}"/></sc-if>
        <sc-if value="{{ hairCurly }}" hint-placeholder-val="{{ false }}"><circle cx="-14" cy="-24" r="9" fill="{{ hair }}"/><circle cx="0" cy="-30" r="10" fill="{{ hair }}"/><circle cx="14" cy="-24" r="9" fill="{{ hair }}"/></sc-if>
        <sc-if value="{{ hasHat }}" hint-placeholder-val="{{ false }}"><path d="M-30 -22h60l-6 -6h-48z" fill="#2C2C2A"/><rect x="-20" y="-40" width="40" height="18" rx="6" fill="#2C2C2A"/></sc-if>
      </svg>
    </div>
    <span style="position: absolute; bottom: 12px; padding: 4px 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #D3D1C7; font-size: 12px; color: #27500A; font-weight: 500">{{ nick }}</span>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 14px 16px 0; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600; color: #27500A">Saç</span>
      <div style="display: flex; gap: 8px">
        <sc-for list="{{ hairs }}" as="h" hint-placeholder-count="3">
        <button onClick="{{ h.pick }}" style="flex: 1; height: 40px; border-radius: 12px; border: 2px solid {{ h.border }}; background: {{ h.bg }}; font-size: 13px; font-weight: 500; color: #27500A; cursor: pointer">{{ h.label }}</button>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600; color: #27500A">Ten · saç rengi · tişört</span>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{ skins }}" as="c" hint-placeholder-count="4">
        <button onClick="{{ c.pick }}" aria-label="Ten rengi" style="width: 36px; height: 36px; border-radius: 50%; border: 3px solid {{ c.border }}; background: {{ c.hex }}; cursor: pointer"></button>
        </sc-for>
        <span style="width: 1px; background: #D3D1C7; margin: 0 2px"></span>
        <sc-for list="{{ hairColors }}" as="c" hint-placeholder-count="3">
        <button onClick="{{ c.pick }}" aria-label="Saç rengi" style="width: 36px; height: 36px; border-radius: 50%; border: 3px solid {{ c.border }}; background: {{ c.hex }}; cursor: pointer"></button>
        </sc-for>
        <span style="width: 1px; background: #D3D1C7; margin: 0 2px"></span>
        <sc-for list="{{ shirts }}" as="c" hint-placeholder-count="4">
        <button onClick="{{ c.pick }}" aria-label="Tişört rengi" style="width: 36px; height: 36px; border-radius: 10px; border: 3px solid {{ c.border }}; background: {{ c.hex }}; cursor: pointer"></button>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; gap: 8px">
      <button onClick="{{ toggleHat }}" style="flex: 1; height: 44px; border-radius: 12px; border: 2px solid {{ hatBorder }}; background: {{ hatBg }}; font-size: 14px; font-weight: 500; color: #27500A; cursor: pointer">🧢 Şapka</button>
      <button onClick="{{ togglePack }}" style="flex: 1; height: 44px; border-radius: 12px; border: 2px solid {{ packBorder }}; background: {{ packBg }}; font-size: 14px; font-weight: 500; color: #27500A; cursor: pointer">🎒 Sırt çantası</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="nick" style="font-size: 13px; font-weight: 600; color: #27500A">Takma ad</label>
      <input id="nick" value="Nisanur" style="height: 48px; border-radius: 12px; border: 1px solid #D3D1C7; background: #FFFFFF; padding: 0 14px; font-size: 15px; color: #173404; box-sizing: border-box">
      <span style="font-size: 12px; color: #888780">Gerçek isim ve fotoğraf gerekmez. Diller: TR · EN · Deneyim: orta</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #D3D1C7">
      <div style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 600">Haritada görün</span><span style="font-size: 12px; color: #5F5E5A">Yalnız çevrimiçiyken, 250 m hücre</span></div>
      <button onClick="{{ toggleVis }}" aria-label="Görünürlük" style="width: 52px; height: 30px; border-radius: 15px; border: none; background: {{ visBg }}; position: relative; cursor: pointer"><span style="position: absolute; top: 3px; left: {{ visKnob }}; width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF"></span></button>
    </div>
  </div>
  <div style="padding: 10px 16px 12px">
    <a href="Harita.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 16px; background: #3B6D11; color: #EAF3DE; text-decoration: none; font-size: 16px; font-weight: 600">Kaydet ve haritaya dön</a>
  </div>
  <div style="height: 84px; background: #FFFFFF; border-top: 1px solid #D3D1C7; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px">
    <a href="Harita.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 70px; text-decoration: none; color: #888780; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#888780" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 6v16l7-4 8 4 7-4V2l-7 4-8-4-7 4z"/><path d="M8 2v16M16 6v16"/></svg>Harita
    </a>
    <a href="Etaplar.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 70px; text-decoration: none; color: #888780; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#888780" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20l6-14 4 8 3-5 5 11z"/></svg>Etap
    </a>
    <a href="Pano.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 70px; text-decoration: none; color: #888780; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#888780" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Pano
    </a>
    <a href="Profil.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 70px; text-decoration: none; color: #27500A; font-size: 11px; font-weight: 600">
      <svg width="24" height="24" viewBox="-12 -12 24 24" aria-hidden="true"><circle r="11" fill="{{ bg }}"/><circle cy="-2.5" r="4" fill="{{ skin }}"/><path d="M-6 8c.5-4 3-6 6-6s5.5 2 6 6" fill="{{ shirt }}"/></svg>Ben
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { hair: 'long', skin: '#F0997B', hairColor: '#854F0B', shirt: '#3B6D11', hat: false, pack: true, vis: true }; }
  renderVals() {
    const s = this.state;
    const sw = (list, key) => list.map(hex => ({ hex, border: s[key] === hex ? '#173404' : '#FFFFFF', pick: () => this.setState({ [key]: hex }) }));
    const hairs = [['long', 'Uzun'], ['short', 'Kısa'], ['curly', 'Kıvırcık']].map(([id, label]) => ({ label, border: s.hair === id ? '#3B6D11' : '#D3D1C7', bg: s.hair === id ? '#EAF3DE' : '#FFFFFF', pick: () => this.setState({ hair: id }) }));
    const bgs = { '#3B6D11': '#FAEEDA', '#D85A30': '#E1F5EE', '#378ADD': '#E6F1FB', '#534AB7': '#EEEDFE' };
    return {
      hairs, skins: sw(['#F5C4B3', '#F0997B', '#B4B2A9', '#854F0B'], 'skin'), hairColors: sw(['#854F0B', '#2C2C2A', '#EF9F27'], 'hairColor'), shirts: sw(['#3B6D11', '#D85A30', '#378ADD', '#534AB7'], 'shirt'),
      skin: s.skin, hair: s.hairColor, shirt: s.shirt, bg: bgs[s.shirt] || '#FAEEDA',
      hairLong: s.hair === 'long', hairShort: s.hair === 'short', hairCurly: s.hair === 'curly',
      hasHat: s.hat, hasPack: s.pack,
      hatBorder: s.hat ? '#3B6D11' : '#D3D1C7', hatBg: s.hat ? '#EAF3DE' : '#FFFFFF',
      packBorder: s.pack ? '#3B6D11' : '#D3D1C7', packBg: s.pack ? '#EAF3DE' : '#FFFFFF',
      toggleHat: () => this.setState({ hat: !s.hat }), togglePack: () => this.setState({ pack: !s.pack }),
      visBg: s.vis ? '#3B6D11' : '#B4B2A9', visKnob: s.vis ? '25px' : '3px', toggleVis: () => this.setState({ vis: !s.vis }),
      nick: 'Nisanur'
    };
  }
}
</script>
</body>
</html>
