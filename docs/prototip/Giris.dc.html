<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Giriş</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#3B6D11}a:hover{color:#27500A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F1E8; color: #173404; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 64px 24px 40px; gap: 28px">
  <a href="Main.dc.html" aria-label="Geri" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #D3D1C7; display: flex; align-items: center; justify-content: center; text-decoration: none; background: #FFFFFF">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#173404" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 600">E-postanla giriş yap</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #5F5E5A">Şifre yok. Sana 6 haneli bir kod göndereceğiz.</p>
  </div>
  <sc-if value="{{ step1 }}" hint-placeholder-val="{{ true }}">
  <div style="display: flex; flex-direction: column; gap: 16px">
    <label for="email" style="font-size: 14px; font-weight: 500; color: #27500A">E-posta</label>
    <input id="email" type="email" placeholder="ad@ornek.com" style="height: 56px; border-radius: 14px; border: 1px solid #D3D1C7; background: #FFFFFF; padding: 0 16px; font-size: 17px; color: #173404; box-sizing: border-box">
    <button onClick="{{ sendCode }}" style="height: 56px; border-radius: 14px; border: none; background: #3B6D11; color: #EAF3DE; font-size: 17px; font-weight: 600; cursor: pointer">Kod gönder</button>
  </div>
  </sc-if>
  <sc-if value="{{ step2 }}" hint-placeholder-val="{{ false }}">
  <div style="display: flex; flex-direction: column; gap: 16px">
    <label for="code" style="font-size: 14px; font-weight: 500; color: #27500A">Gelen kod</label>
    <input id="code" inputmode="numeric" placeholder="123456" style="height: 64px; border-radius: 14px; border: 1px solid #D3D1C7; background: #FFFFFF; padding: 0 16px; font-size: 28px; letter-spacing: 8px; text-align: center; color: #173404; box-sizing: border-box">
    <p style="margin: 0; font-size: 13px; color: #5F5E5A">Kod 10 dakika geçerli. Gelmedi mi? <a href="Giris.dc.html">Tekrar gönder</a></p>
    <a href="Izinler.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #3B6D11; color: #EAF3DE; text-decoration: none; font-size: 17px; font-weight: 600">Doğrula</a>
  </div>
  </sc-if>
  <div style="display: flex; align-items: center; gap: 12px; color: #888780; font-size: 13px">
    <div style="flex: 1; height: 1px; background: #D3D1C7"></div><span>ya da</span><div style="flex: 1; height: 1px; background: #D3D1C7"></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px">
    <a href="Izinler.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border-radius: 14px; background: #FFFFFF; border: 1px solid #D3D1C7; color: #173404; text-decoration: none; font-size: 15px; font-weight: 500">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#173404" aria-hidden="true"><path d="M16.4 12.6c0-2.5 2-3.7 2.1-3.8-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.8.9-.8 0-2-.9-3.3-.8-1.7 0-3.2 1-4.1 2.5-1.8 3.1-.5 7.6 1.3 10.1.9 1.2 1.9 2.6 3.2 2.5 1.3-.1 1.8-.8 3.3-.8s2 .8 3.3.8c1.4 0 2.2-1.2 3.1-2.5 1-1.4 1.4-2.8 1.4-2.8s-2.7-1-2.9-4.1zM13.9 5.2c.7-.8 1.2-2 1-3.2-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3.1 1.1.1 2.2-.6 2.9-1.4z"/></svg>
      Apple ile devam et
    </a>
    <a href="Izinler.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border-radius: 14px; background: #FFFFFF; border: 1px solid #D3D1C7; color: #173404; text-decoration: none; font-size: 15px; font-weight: 500">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#173404" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      Google ile devam et
    </a>
  </div>
  <p style="margin: auto 0 0; text-align: center; font-size: 12px; color: #888780">Apple/Google girişi ikinci sürümde; şimdilik e-posta.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sent: false }; }
  renderVals() {
    return {
      step1: !this.state.sent,
      step2: this.state.sent,
      sendCode: () => this.setState({ sent: true })
    };
  }
}
</script>
</body>
</html>
