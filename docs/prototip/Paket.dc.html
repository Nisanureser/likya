<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Harita paketi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#3B6D11}a:hover{color:#27500A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F1E8; color: #173404; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 64px 24px 40px; gap: 24px">
  <div style="display: flex; flex-direction: column; gap: 8px">
    <p style="margin: 0; font-size: 13px; font-weight: 500; color: #3B6D11">Adım 3 / 3</p>
    <h1 style="margin: 0; font-size: 28px; font-weight: 600">Likya Yolu'nu indir</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #5F5E5A">Harita, 29 etap ve tüm noktalar telefonunda kalır. Rotada sinyal olmasa da çalışır.</p>
  </div>
  <div style="border-radius: 20px; background: #FFFFFF; border: 1px solid #D3D1C7; overflow: hidden">
    <div style="height: 180px; background: #EAF3DE; position: relative">
      <svg width="340" height="180" viewBox="0 0 340 180" aria-hidden="true" style="position: absolute; inset: 0">
        <path d="M0 150 L60 90 L110 130 L170 60 L230 110 L290 70 L340 100 L340 180 L0 180 Z" fill="#C0DD97"/>
        <path d="M10 120 C70 100 110 150 170 95 S260 60 330 40" fill="none" stroke="#3B6D11" stroke-width="5" stroke-linecap="round"/>
        <circle cx="60" cy="112" r="7" fill="#378ADD"/><circle cx="170" cy="95" r="7" fill="#378ADD"/><circle cx="260" cy="72" r="7" fill="#854F0B"/>
        <text x="16" y="28" font-size="13" font-weight="600" fill="#27500A" font-family="Inter, system-ui, sans-serif">Fethiye → Antalya · 540 km</text>
      </svg>
    </div>
    <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; font-size: 14px; color: #5F5E5A">
        <span>Harita karoları (z8–14)</span><span style="color: #173404; font-weight: 500">310 MB</span>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 14px; color: #5F5E5A">
        <span>Etaplar, noktalar, yükseklik</span><span style="color: #173404; font-weight: 500">6 MB</span>
      </div>
      <div style="height: 1px; background: #D3D1C7"></div>
      <sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ start }}" style="height: 52px; border-radius: 12px; border: none; background: #3B6D11; color: #EAF3DE; font-size: 16px; font-weight: 600; cursor: pointer">İndir · 316 MB</button>
      </sc-if>
      <sc-if value="{{ busy }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #27500A; font-weight: 500">İndiriliyor…</span><span style="color: #5F5E5A">{{ pct }}%</span></div>
        <div style="height: 8px; border-radius: 4px; background: #EAF3DE; overflow: hidden"><div style="height: 8px; width: {{ pctW }}; background: #3B6D11"></div></div>
      </div>
      </sc-if>
      <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; background: #EAF3DE; color: #27500A; font-size: 15px; font-weight: 500">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#27500A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
        İndirildi · çevrimdışı hazır
      </div>
      </sc-if>
    </div>
  </div>
  <label style="display: flex; align-items: center; gap: 12px; font-size: 14px; color: #5F5E5A">
    <input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #3B6D11">
    Yalnız Wi‑Fi'da indir
  </label>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <a href="Harita.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: {{ ctaBg }}; color: {{ ctaFg }}; text-decoration: none; font-size: 17px; font-weight: 600">Haritayı aç</a>
    <a href="Harita.dc.html" style="text-align: center; font-size: 14px; color: #5F5E5A; text-decoration: none; padding: 8px">Sonra indir, şimdi çevrimiçi kullan</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { phase: 'idle', pct: 0 }; }
  renderVals() {
    const s = this.state;
    return {
      idle: s.phase === 'idle', busy: s.phase === 'busy', done: s.phase === 'done',
      pct: s.pct, pctW: s.pct + '%',
      ctaBg: s.phase === 'done' ? '#3B6D11' : '#D3D1C7',
      ctaFg: s.phase === 'done' ? '#EAF3DE' : '#5F5E5A',
      start: () => {
        this.setState({ phase: 'busy', pct: 0 });
        const t = setInterval(() => {
          const n = Math.min(100, this.state.pct + 9);
          if (n >= 100) { clearInterval(t); this.setState({ phase: 'done', pct: 100 }); }
          else this.setState({ pct: n });
        }, 180);
      }
    };
  }
}
</script>
</body>
</html>
