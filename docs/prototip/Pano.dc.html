<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Pano</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#3B6D11}a:hover{color:#27500A}
@keyframes rise{0%{transform:translateY(16px);opacity:0}100%{transform:translateY(0);opacity:1}}
.rise{animation:rise .35s cubic-bezier(.2,.9,.3,1.2) both}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F1E8; color: #173404; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 16px 8px">
    <div style="display: flex; flex-direction: column">
      <h1 style="margin: 0; font-size: 26px; font-weight: 600">Pano</h1>
      <span style="font-size: 13px; color: #5F5E5A">Etap 12 civarı · bugün</span>
    </div>
    <a href="Acil.dc.html" aria-label="Acil durum" style="width: 44px; height: 44px; border-radius: 50%; background: #A32D2D; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #FFFFFF; font-size: 12px; font-weight: 700">SOS</a>
  </div>
  <div style="display: flex; gap: 8px; padding: 8px 16px 12px">
    <button onClick="{{ tabNeeds }}" style="padding: 8px 14px; border-radius: 999px; border: 1px solid {{ nBorder }}; background: {{ nBg }}; color: {{ nFg }}; font-size: 13px; font-weight: 600; cursor: pointer">İhtiyaçlar · 2</button>
    <button onClick="{{ tabHere }}" style="padding: 8px 14px; border-radius: 999px; border: 1px solid {{ hBorder }}; background: {{ hBg }}; color: {{ hFg }}; font-size: 13px; font-weight: 600; cursor: pointer">Bu etaptakiler · 5</button>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 0 16px; overflow: hidden">
    <sc-if value="{{ showNeeds }}" hint-placeholder-val="{{ true }}">
    <sc-for list="{{ needs }}" as="n" hint-placeholder-count="3">
    <a href="Teklif.dc.html" class="rise" style="display: flex; gap: 12px; padding: 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid {{ n.border }}; text-decoration: none; color: #173404">
      <div style="position: relative; flex-shrink: 0">
        <svg width="52" height="52" viewBox="-26 -26 52 52" aria-hidden="true"><circle r="25" fill="{{ n.bg }}"/><circle cy="-5" r="8.5" fill="{{ n.skin }}"/><path d="M-13 16c1-8 6-12 13-12s12 4 13 12" fill="{{ n.shirt }}"/></svg>
        <span style="position: absolute; right: -8px; top: -8px; width: 30px; height: 30px; border-radius: 50%; background: #FFFFFF; border: 1.5px solid {{ n.border }}; display: flex; align-items: center; justify-content: center; font-size: 16px">{{ n.emoji }}</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0">
        <div style="display: flex; align-items: center; gap: 6px"><span style="font-size: 16px; font-weight: 600">{{ n.who }}</span><span style="font-size: 12px; color: #888780">· {{ n.when }}</span></div>
        <span style="font-size: 14px; line-height: 1.4; color: #173404">{{ n.text }}</span>
        <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px">
          <span style="padding: 4px 10px; border-radius: 999px; background: {{ n.statusBg }}; color: {{ n.statusFg }}; font-size: 12px; font-weight: 600">{{ n.status }}</span>
          <span style="font-size: 12px; color: #5F5E5A">{{ n.dist }}</span>
        </div>
      </div>
    </a>
    </sc-for>
    </sc-if>
    <sc-if value="{{ showHere }}" hint-placeholder-val="{{ false }}">
    <sc-for list="{{ people }}" as="p" hint-placeholder-count="4">
    <div class="rise" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #D3D1C7">
      <svg width="44" height="44" viewBox="-22 -22 44 44" aria-hidden="true"><circle r="21" fill="{{ p.bg }}"/><circle cy="-4" r="7" fill="{{ p.skin }}"/><path d="M-11 14c1-7 5-10 11-10s10 3 11 10" fill="{{ p.shirt }}"/></svg>
      <div style="display: flex; flex-direction: column; gap: 2px; flex: 1">
        <span style="font-size: 15px; font-weight: 600">{{ p.who }} <span style="font-size: 12px; font-weight: 400; color: #888780">{{ p.langs }}</span></span>
        <span style="font-size: 13px; color: #5F5E5A">{{ p.plan }}</span>
      </div>
      <a href="Teklif.dc.html" style="padding: 8px 12px; border-radius: 10px; border: 1px solid #D3D1C7; background: #F4F1E8; color: #27500A; text-decoration: none; font-size: 13px; font-weight: 600">Selam 👋</a>
    </div>
    </sc-for>
    </sc-if>
  </div>
  <div style="padding: 10px 16px 12px">
    <a href="Ihtiyac.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 16px; background: #3B6D11; color: #EAF3DE; text-decoration: none; font-size: 16px; font-weight: 600"><span style="font-size: 20px">🙋</span> Bir şeye ihtiyacım var</a>
  </div>
  <div style="height: 84px; background: #FFFFFF; border-top: 1px solid #D3D1C7; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px">
    <a href="Harita.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 70px; text-decoration: none; color: #888780; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#888780" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 6v16l7-4 8 4 7-4V2l-7 4-8-4-7 4z"/><path d="M8 2v16M16 6v16"/></svg>Harita
    </a>
    <a href="Etaplar.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 70px; text-decoration: none; color: #888780; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#888780" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20l6-14 4 8 3-5 5 11z"/></svg>Etap
    </a>
    <a href="Pano.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 70px; text-decoration: none; color: #27500A; font-size: 11px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#27500A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Pano
    </a>
    <a href="Profil.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 70px; text-decoration: none; color: #888780; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="-12 -12 24 24" aria-hidden="true"><circle r="11" fill="#FAEEDA"/><circle cy="-2.5" r="4" fill="#F0997B"/><path d="M-6 8c.5-4 3-6 6-6s5.5 2 6 6" fill="#3B6D11"/></svg>Ben
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'needs' }; }
  renderVals() {
    const t = this.state.tab;
    const on = { border: '#3B6D11', bg: '#3B6D11', fg: '#EAF3DE' }, off = { border: '#D3D1C7', bg: '#FFFFFF', fg: '#5F5E5A' };
    const n = t === 'needs' ? on : off, h = t === 'here' ? on : off;
    return {
      showNeeds: t === 'needs', showHere: t === 'here',
      tabNeeds: () => this.setState({ tab: 'needs' }), tabHere: () => this.setState({ tab: 'here' }),
      nBorder: n.border, nBg: n.bg, nFg: n.fg, hBorder: h.border, hBg: h.bg, hFg: h.fg,
      needs: [
        { who: 'Ayşe', when: '12 dk', emoji: '💧', text: 'Çeşme kuruymuş, 1 litre yeter. Alınca yolunda ilerliyorum.', status: 'Bekliyor', statusBg: '#FAEEDA', statusFg: '#633806', dist: '1,2 km ileride', border: '#378ADD', bg: '#E1F5EE', skin: '#F5C4B3', shirt: '#D85A30' },
        { who: 'Mehmet', when: '40 dk', emoji: '🔋', text: 'Telefonum %6, powerbank ödünç alabilir miyim? Gey\'de akşam iade ederim.', status: 'Teklif var · Lena', statusBg: '#E6F1FB', statusFg: '#0C447C', dist: '2,8 km geride', border: '#BA7517', bg: '#E6F1FB', skin: '#B4B2A9', shirt: '#378ADD' },
        { who: 'Sen', when: 'dün', emoji: '🤝', text: 'Yarın Gey → Bel etabı için yürüyüş arkadaşı arıyorum, 08:00 çıkış.', status: 'Tamamlandı ✓', statusBg: '#EAF3DE', statusFg: '#27500A', dist: 'Lena katıldı', border: '#D3D1C7', bg: '#FAEEDA', skin: '#F0997B', shirt: '#3B6D11' }
      ],
      people: [
        { who: 'Lena', langs: 'DE · EN', plan: 'Bu gece Alınca, yarın Gey', bg: '#FAEEDA', skin: '#F0997B', shirt: '#854F0B' },
        { who: 'Ayşe', langs: 'TR · EN', plan: 'Kabak\'tan çıktı, Alınca\'ya gidiyor', bg: '#E1F5EE', skin: '#F5C4B3', shirt: '#D85A30' },
        { who: 'Mehmet', langs: 'TR', plan: 'Yavaş gidiyor, Alınca\'da kalacak', bg: '#E6F1FB', skin: '#B4B2A9', shirt: '#378ADD' },
        { who: 'Tom & Jo', langs: 'EN', plan: 'Kamp, Gey öncesi dere kenarı', bg: '#EEEDFE', skin: '#F5C4B3', shirt: '#534AB7' }
      ]
    };
  }
}
</script>
</body>
</html>
