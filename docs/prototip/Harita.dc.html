  <div style="position: absolute; left: 16px; right: 16px; bottom: 96px; display: flex; flex-direction: column; gap: 10px">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { layers: false, offTrack: false }; }
  renderVals() {
    return {
      layers: this.state.layers,
      offTrack: this.state.offTrack,
      toggleLayers: () => this.setState({ layers: !this.state.layers }),
      simulate: () => this.setState({ offTrack: true }),
      dismiss: () => this.setState({ offTrack: false })
    };
  }
}
</script>
