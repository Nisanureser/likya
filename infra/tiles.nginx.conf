server {
  listen 80;
  root /usr/share/nginx/html;
  add_header Access-Control-Allow-Origin *;
  add_header Access-Control-Allow-Headers Range;
  add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges";
  location ~* \.pmtiles$ { add_header Cache-Control "public, max-age=86400"; }
  location ~* \.json$ { add_header Cache-Control "public, max-age=300"; }
}
